name: ✨ 기능
description: 서버·클라이언트 기능을 구현할 때 사용해요
labels: ['type: feature']
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[12주차] 벨 대기열과 순서 표시 (D1~D3)`처럼 주차를 앞에, 관련 기능 ID를 뒤에 붙여 주세요.
        담당자는 **Assignees**, 주차는 **Milestone**, 영역은 `area:` 라벨로 지정해요.
        이슈 하나는 주간 보고서에서 한 덩어리로 설명할 수 있는 크기로 잡아요. (한 주에 한 사람 1~2개)

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 이슈가 끝나면 무엇이 되는지 한두 문장으로 적어 주세요.
      placeholder: 여러 명이 동시에 벨을 눌러도 서버 도착 순서대로 줄을 세우고, 모든 화면에 순서를 보여준다.
    validations:
      required: true

  - type: textarea
    id: meta
    attributes:
      label: 정보
      value: |
        - 작업 기간:
        - 선행 이슈:
        - 관련 요구사항: (PRD 기능 ID, 예: D1 벨 누르기 · D2 벨 대기열 · N1 벨 순서 공정성)
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 작업·완료 기준
      description: 확인할 수 있는 단위로 나누고, 마지막 항목에 검증 방법을 적어 주세요.
      value: |
        - [ ]
        - [ ]
        - [ ] 검증: (JUnit 테스트 / 서버 1 + 클라이언트 3개 실행 / PRD 시나리오 5.x)
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 설계 메모
      description: 어느 패키지·클래스에 둘지, 새 메시지·핸들러가 필요한지 (선택)
      placeholder: |
        - server/game/BellQueue — 줄 세우기·중복 방지 (synchronized)
        - server/handler/BuzzHandler — BUZZ 처리 후 QUEUE·TURN 브로드캐스트
