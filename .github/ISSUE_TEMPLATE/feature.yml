name: ✨ 기능
description: 서버·클라이언트 기능을 구현할 때 사용해요
labels: ['type: feature']
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[M2] 벨 대기열과 순서 표시 (D1~D3)`처럼 마일스톤 번호를 앞에, 관련 기능 ID를 뒤에 붙여 주세요.
        담당자는 **Assignees**, 마일스톤(M0~M5, 괄호 안이 주차)은 **Milestone**, 영역은 `area:` 라벨로 지정해요.
        이슈 하나는 목적 하나, 담당은 한 명이에요. 주간 보고서에서 한 덩어리로 설명할 수 있는 크기로 잡아요.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 이슈가 끝나면 무엇이 되는지 한두 문장으로 적어 주세요.
      placeholder: 여러 명이 동시에 벨을 눌러도 서버 도착 순서대로 줄을 세우고, 모든 화면에 순서를 보여준다.
    validations:
      required: true

  - type: textarea
    id: meta
    attributes:
      label: 정보
      value: |
        - 담당: (라인 A / 라인 B)
        - 작업 기간: 2026/MM/DD~MM/DD · 팀 내부 계획
        - 선행 이슈:
        - 관련 요구사항: (PRD 기능 ID, 예: D1 벨 누르기 · D2 벨 대기열 · N1 벨 순서 공정성)
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: 구현 위치 (참고)
      description: 어느 패키지·클래스에 둘지, 새 메시지·핸들러가 필요한지. 구현 방법은 담당자가 정해요.
      placeholder: |
        - `BUZZ` 핸들러(`BellQueue` 사용), `QUEUE`·`TURN` 메시지
        - 게임 화면 벨 버튼·벨 순서 영역

  - type: textarea
    id: done
    attributes:
      label: 작업·완료 기준
      description: 확인할 수 있는 단위로 나눠 주세요. 숫자·횟수·화면 문구까지 적으면 언제 닫을지 분명해져요.
      value: |
        아래를 모두 체크하고, PR이 리뷰 승인·CI 통과로 머지되면 닫는다.

        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 검증
      description: JUnit / 서버 1 + 클라이언트 N개 실행 / PRD 시나리오 5.x / 콘솔 클라이언트 중 무엇으로 확인할지
    validations:
      required: true
